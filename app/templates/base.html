<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Customer Churn Prediction{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand-box">
                <h3>ChurnLens</h3>
                <span>Customer Analytics</span>
            </div>
            <nav class="nav flex-column">
                <a class="nav-link" href="/">Overview</a>
                <a class="nav-link" href="/analysis">Data Analysis</a>
                <a class="nav-link" href="/model-performance">Model Performance</a>
                <a class="nav-link" href="/prediction">Single Prediction</a>
                <a class="nav-link" href="/batch-prediction">Batch Prediction</a>
                <a class="nav-link" href="/history">Prediction History</a>
                <a class="nav-link" href="/about">About</a>
            </nav>
        </aside>
        <main class="content-area">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
